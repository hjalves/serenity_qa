{% load static %}

<tr>
  <td class="shrink">
    <a href="{{ question.admin_url }}" class="changelink"></a>
  </td>
  <th scope="row" class="shrink"><a
      onclick="return seekPlayer(this);"
      href="{{ question.url }}"
      data-timestamp="{{ question.timestamp }}"
      data-timestamp-sec="{{ question.timestamp.total_seconds }}"
      >{{ question.timestamp }}</a>
  </th>
  <td class="expand">
    {% if edit %}
      <form hx-patch="/admin/htmx/video/{{ video.id }}/questions/{{ question.id }}/"
            hx-target="closest tr" hx-swap="outerHTML">
        {% csrf_token %}
        <div class="edit-question">
          <input id="id_edit_question" type="text" name="question"
                 value="{{ question.question }}">
          <input type="submit" value="✓">
        </div>
      </form>
    {% else %}
      <a href="{{ question.admin_url }}"
         hx-get="/admin/htmx/video/{{ video.id }}/questions/{{ question.id }}/?edit"
         hx-target="closest tr" hx-swap="outerHTML">
        {{ question.question | default:"--" }}
      </a>
    {% endif %}
  </td>
  <td>
    <a href="{{ question.admin_delete_url }}" class="deletelink"
       hx-delete="/admin/htmx/video/{{ video.id }}/questions/{{ question.id }}/"
       hx-target="closest tr"
       hx-confirm="Delete this question?"
       hx-swap="delete swap:0.5s"></a>
  </td>
</tr>
