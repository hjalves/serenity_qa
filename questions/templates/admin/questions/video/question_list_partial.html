{% load static %}
<table id="video-questions-table" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <thead>
  <tr>
    <th scope="col" class="shrink"></th>
    <th scope="col" class="shrink">Timestamp</th>
    <th scope="col" class="expand">Question</th>
    <th scope="col" class="shrink"></th>
  </tr>
  </thead>
  <tbody>
  {% for question in video.questions %}
    {% if question == editing_question %}
      {% include "admin/questions/video/question_detail_partial.html" with edit=True %}
    {% else %}
      {% include "admin/questions/video/question_detail_partial.html" %}
    {% endif %}
  {% endfor %}
  </tbody>
</table>
