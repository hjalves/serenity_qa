{% load questions_extras %}
<article id="{{ id }}" class="question">
  <div class="question-header">
    <a class="title" href="#{{ id }}">{{ question.video.title }}</a>
    <a class="duration" title="Duration"
       href="#">{{ question.duration|format_duration|default:"--" }}</a>
  </div>
  <div class="question-body">
    <div class="timestamp">
      <a title="Watch in YouTube"
         href="{{ question.url }}">{{ question.timestamp }}</a>
    </div>
    <div class="content">
      {{ question.question }}
    </div>
  </div>
  <div class="question-footer">
    <div class="tags">
      {% for tag in question.tags.all %}
        <a class="tag">{{ tag.name }}</a>{% endfor %}
    </div>
    <div class="clear"></div>
  </div>
</article>
