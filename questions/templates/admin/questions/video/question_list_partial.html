{% load static %}
<table id="video-questions-table" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <thead>
  <tr>
    <th scope="col" class="shrink"></th>
    <th scope="col" class="shrink">Timestamp</th>
    <th scope="col" class="expand">Question</th>
    <th scope="col" class="shrink"></th>
  </tr>
  </thead>
  <tbody>
  {% for question in video.questions %}
    <tr>
      <td class="shrink">
        <a href="{{ question.admin_url }}" class="changelink"></a>
      </td>
      <th scope="row" class="shrink"><a
          href="javascript:player.seekTo({{ question.timestamp.total_seconds }});">{{ question.timestamp }}</a>
      </th>
      <td class="expand">{{ question.question | default:"--" }}<a></a></td>
      <td>
        <a href="#" class="deletelink"
           hx-delete="/admin/htmx/video/{{ video.id }}/questions/{{ question.id }}/"
           hx-target="closest tr"
           hx-confirm="Delete this question?"
           hx-swap="delete swap:0.5s"></a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
