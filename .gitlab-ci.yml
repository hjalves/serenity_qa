variables:
  IMAGE_NAME: registry.gitlab.com/hjalves/serenity_qa

stages:
  - build

build image:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_NAME || true
    - docker build --file Dockerfile
      --cache-from $IMAGE_NAME --tag $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - main
