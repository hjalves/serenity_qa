{% load questions_extras %}
<section id="{{ id }}" class="video-info">
  <div class="video-info-header">
    <a class="title" href="#{{ id }}"><span class="emoji">{{ emoji }}</span>{{ title }}</a>
    <a class="subtitle" href="#{{ id }}">Livestream</a>
  </div>
  <div class="video-info-body">
    <dl>
      <dt>Title and link</dt>
      <dd><a href="{{ url }}">{{ title }}</a></dd>
    </dl>
    <dl class="half">
      <dt>Published</dt>
      <dd>{{ published }}</dd>
      <dt>Duration</dt>
      <dd>{{ duration }}</dd>
    </dl>
    <dl class="half">
      <dt>Timestamped</dt>
      <dd>{{ questions }} <abbr title="May also be comments or sections">questions</abbr></dd>
      <dt>Export to...</dt>
      <dd><a href="?format=json">JSON</a>, <a href="?format=kdl">KDL</a> or <a href="?format=xml">XML</a></dd>
    </dl>
  </div>
</section>
