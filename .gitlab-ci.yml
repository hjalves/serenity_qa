variables:
  IMAGE_NAME: registry.gitlab.com/hjalves/serenity_qa

stages:
  - build
  - deploy

build image:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --file Dockerfile --tag $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - main

deploy:
  stage: deploy
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none
  script:
    - 'curl -sfD- --user $DEPLOY_AUTH "$DEPLOY_URL?$DEPLOY_ARGS" | tee /tmp/output'
    - 'grep -i "X-Shell2http-Exit-Code: 0" /tmp/output'
  environment:
    name: Production
    url: https://qa.serenityos.dev
  only:
    - main
