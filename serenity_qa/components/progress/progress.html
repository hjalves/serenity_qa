<article {% if id %}id="{{ id }}"{% endif %} class="progress">
  <div class="progress-header">
    <a class="title" href="#{{ id }}">Project Status</a>
  </div>
  <div class="progress-body">
    <div class="timestamp">
      <a title="Watch in YouTube" href="">XX:AA:BB</a>
    </div>
    <div class="content">
      Content
    </div>
  </div>
  <div class="progress-footer">
    <div>Last changed: 2022-12-24 12:34:56</div>
    <div class="clear"></div>
  </div>
</article>
