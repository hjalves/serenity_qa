<nav>
  <ul>
    <li class="title">SerenityOS Q&A</li>
    {% for page in pages %}
      <li><a href="{% url 'page' page.slug %}"
             class="{% if self == page %}current{% endif %}">{{ page.title }}</a></li>
    {% endfor %}
  </ul>
  <ul>
    <li class="title">Office hours</li>
    {% for video in videos %}
      <li><a href="{% url 'video' video.id %}"
             class="{% if self == video %}current{% endif %}">{{ video.published }}</a></li>
    {% endfor %}
  </ul>
  <ul>
    <li class="title">Search</li>
  </ul>
  {#    <input type="text" id="search" name="search">#}
</nav>
